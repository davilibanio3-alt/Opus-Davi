name: Calixto

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install workspace deps
        run: npm install --workspaces --include-workspace-root
      - name: Build internal libs
        run: |
          npm run build -w tx-engine
          npm run build -w recovery
          npm run build -w ai-engine
      - name: Build frontend (static export, GH Pages basePath)
        env:
          NEXT_PUBLIC_GH_PAGES: "1"
          NEXT_PUBLIC_MEMPOOL_API: "https://mempool.space/api"
          NEXT_PUBLIC_MEMPOOL_WS: "wss://mempool.space/api/v1/ws"
          NEXT_PUBLIC_NETWORK: "mainnet"
          NEXT_PUBLIC_BACKEND_URL: ""
        run: npm run build -w frontend
      - name: Add .nojekyll
        run: touch frontend/out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
