# Default bitcoin.conf for the Opus-Davi pool node.
#
# RPC credentials are injected at runtime via the entrypoint (we render a
# `rpcauth=` line using BITCOIND_RPC_USER + BITCOIND_RPC_PASSWORD). The
# baseline below covers everything else.

# --- network ---
chain=main
listen=1
maxconnections=80

# --- mempool / index ---
# txindex helps when the pool wants to look up arbitrary txs for debugging,
# and costs ~70 GB extra disk on Mainnet. Comment out if disk is tight.
txindex=1
# Keep the mempool large enough to fit the next 4 blocks of fees
maxmempool=512
mempoolexpiry=72

# --- pruning (DISABLED by default — getblocktemplate works either way) ---
# To run pruned, uncomment ONE of the following and remove txindex.
# prune=10000   # 10 GB
# prune=50000   # 50 GB

# --- RPC ---
server=1
rpcbind=0.0.0.0:8332
rpcallowip=127.0.0.1
rpcallowip=10.0.0.0/8
rpcallowip=172.16.0.0/12
rpcallowip=192.168.0.0/16
rpcworkqueue=64
rpcthreads=8

# --- performance ---
dbcache=2048
par=0

# --- ZMQ (optional, future: instant tip notifications to the pool) ---
zmqpubhashblock=tcp://0.0.0.0:28332
zmqpubhashtx=tcp://0.0.0.0:28333
